# ELKS Networking Configuration File
# sourced by /bin/net for ktcp and daemons

# Default IP address, gate and network mask set in /bootopts or overridden here.
# These can be IP addresses or names in /etc/hosts.
# If not set, DCHP will be used.
localip=$LOCALIP
gateway=$GATEWAY
netmask=$NETMASK

# reduce for 8bit NE2K w/4K buffer
# Solution-02 : SLIP vers le module Wi-Fi, tampon de 1 Ko dans l'ATmega : petits paquets
mtu="-m 512"
#mtu="-m 1000"

# default link layer
link=slip

# default serial port and baud rate if slip/cslip
# Solution-02 : ttyS1 = module Wi-Fi (esp_slip_router) par le BIOS, 115200 fixes
device=/dev/ttyS1
baud=115200

# daemons to start are actually shell variable command lines see below
# Solution-02 : telnetd seul (memoire : ftpd prend ~26 Ko)
netstart="telnetd"
#netstart="ftpd"

# specific daemon command lines, named in netstart=
telnetd="telnetd"
ftpd="ftpd -d -P 49152:49159"
httpd="httpd"
audiorcv="audiorcv -d -r 8000"

# custom code executed before network startup
custom_prestart_network()
{
}

# custom code executed after network startup
custom_poststart_network()
{
	#echo "Network started"
}

# custom code executed after network shutdown
custom_stop_network()
{
}
