[package]
name = "s02picosim"
version = "1.0.0"
edition = "2021"
description = "Simulateur de Solution-02 avec le Pico W (ports 50h-57h, U18/U19, READY), en WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
s02pico-coeur = { path = "../pico/coeur" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = "1"
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
