; PlatformIO - pont 8088 <-> WeAct Black Pill V3.1 (STM32F411CEU6)
; Compiler:   platformio run          (le croquis est dans src/main.cpp)
; Televerser: platformio run -t upload (DFU: BOOT0 + NRST, ou ST-Link en SWD)
;
; Deux environnements:
;   blackpill_f411ce_usbdrive   (defaut) pile USB Adafruit TinyUSB: port serie CDC + LECTEUR DE
;                               MASSE (la flash apparait au PC apres "USB ON" dans le BASIC).
;   blackpill_f411ce            pile USB du coeur STM32: port serie CDC seulement (secours, ne
;                               connait pas USB ON). Commande:
;                               platformio run -e blackpill_f411ce -t upload

[platformio]
default_envs = blackpill_f411ce_usbdrive

[common]
libs =
    stm32duino/STM32duino RTC@1.8.0
    adafruit/Adafruit SPIFlash
    adafruit/SdFat - Adafruit Fork

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200
monitor_filters = direct, send_on_enter
monitor_echo = yes
upload_protocol = dfu
; Serial = port serie virtuel USB (USB natif de la carte): ne pas retirer
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D HAL_PCD_MODULE_ENABLED
lib_deps = ${common.libs}

[env:blackpill_f411ce_usbdrive]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200
monitor_filters = direct, send_on_enter
monitor_echo = yes
upload_protocol = dfu
build_flags =
    -D USE_TINYUSB
lib_deps =
    ${common.libs}
    adafruit/Adafruit TinyUSB Library
