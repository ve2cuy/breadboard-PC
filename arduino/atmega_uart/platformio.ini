; Solution-02 : ATmega328P (U17), quartz 16 MHz : UART du montage (J5) et esclave SPI du 8088
; sur le bus de la carte SD (schema du 2026-11-21). Protocole : src/protocole.h, README.md.
;
; Construire : pio run (ou make)      -> .pio/build/atmega328p/firmware.hex
; Essais     : make test              (protocole, sur le PC, gcc de WSL)
; Graver     : make flash PUCE=ok     (TL866CS, puce dans le support ZIF ; voir Makefile)
; NE JAMAIS copier ce micrologiciel dans Z:/Partage/Alain (reserve aux ROM du 8088).

[env:atmega328p]
platform = atmelavr
board = ATmega328P
board_build.f_cpu = 16000000L
build_flags = -Os -Wall
