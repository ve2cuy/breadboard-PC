; Solution-02 : ATmega328P (U17), UART du montage derriere U12 (8255) en mode 2.
; Etape 1 : clignotement d'une DEL pour valider l'ATmega sur la plaquette (quartz 16 MHz).
;
; Construire : pio run            -> .pio/build/atmega328p/firmware.hex
; Graver     : make flash PUCE=ok (TL866CS, puce dans le support ZIF ; voir Makefile)
; NE JAMAIS copier ce micrologiciel dans Z:/Partage/Alain (reserve aux ROM du 8088).

[env:atmega328p]
platform = atmelavr
board = ATmega328P
board_build.f_cpu = 16000000L
build_flags = -Os -Wall
