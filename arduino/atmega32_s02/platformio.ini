; Solution-02 : ATmega32-16PU (quartz 16 MHz), futur UART du montage, lecteur de carte SD et lien
; parallele avec le 8088 (U12 en mode 2). Etape 1 : clignotement d'une DEL (src/main.c).
;
; Construire : pio run (ou make)      -> .pio/build/atmega32/firmware.hex
; Graver     : make flash PUCE=ok     (TL866CS, puce dans le support ZIF ; voir Makefile)
; NE JAMAIS copier ce micrologiciel dans Z:/Partage/Alain (reserve aux ROM du 8088).

[env:atmega32]
platform = atmelavr
board = ATmega32
board_build.f_cpu = 16000000L
build_flags = -Os -Wall
